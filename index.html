<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>寵物健康記錄器 / Pet Health Tracker</title>

<!-- PWA Web App 設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pet Tracker">
<meta name="theme-color" content="#faf9f5">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

<style>
  :root { --bg:#fff7f2; --fg:#5b4a42; --peach:#f9a98f; --cream:#fde8df; --mint:#bfe8c9; --font-display:"Huninn","Noto Sans TC",sans-serif; --font-body:"Noto Sans TC",system-ui,sans-serif; color-scheme: light; }
  html.en { --font-display:"Nunito","Noto Sans TC",sans-serif; --font-body:"Nunito","Noto Sans TC",system-ui,sans-serif; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding-inline:0; -webkit-tap-highlight-color: transparent; }
  h1,h2,h3,h4 { font-family: var(--font-display); }
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible { outline:3px solid var(--peach); outline-offset:2px; }
  [x-cloak] { display:none !important; }
  .card { background:#fff; border-radius:1.5rem; box-shadow:0 6px 20px rgba(240,160,140,.15); }
  .inp { width:100%; border:2px solid #fde2d8; background:#fffaf7; border-radius:1rem; padding:.6rem .9rem; outline:none; font-size:16px; }
  .inp:focus { border-color:#f9a98f; }
  .btn { border-radius:9999px; padding:.55rem 1.1rem; font-weight:700; transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  .btn-main { background:#f9a98f; color:#fff; }
  .btn-soft { background:#fde8df; color:#c4725a; }
  .btn-green { background:#bfe8c9; color:#2f7a45; }
  .lbl { font-size:.8rem; color:#a08a80; margin-bottom:.2rem; display:block; }
  .tabbtn.active { color:#f26f4e; }
  .tabbtn.active .ico { background:#fde8df; }
</style>
</head>
<body>

<div class="min-h-screen pb-28" x-data="petApp()" x-cloak>

  <!-- 頂部標題 -->
  <header class="px-4 pt-5 pb-2 max-w-2xl mx-auto flex items-center justify-between gap-2">
    <h1 class="text-lg font-extrabold text-orange-400 truncate min-w-0" x-text="'🐾 ' + t('app_title')"></h1>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" class="btn btn-soft !py-1.5 !px-3 text-sm" @click="guideModal=true" :aria-label="t('guide_title')">❓</button>
      <button type="button" class="btn btn-soft !py-1.5 !px-3 text-sm" @click="setLang(lang==='zh' ? 'en' : 'zh')" x-text="lang==='zh' ? 'EN' : '中文'"></button>
      <template x-if="data.cats.length">
        <select class="inp !w-auto !max-w-[7rem] !py-1.5 !text-sm font-bold" x-model="data.activeId">
          <template x-for="c in data.cats" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
        </select>
      </template>
    </div>
  </header>
  <p class="px-4 max-w-2xl mx-auto text-xs" style="color:#a08a80" x-text="t('saved_note')"></p>

  <main class="px-4 max-w-2xl mx-auto space-y-4">

    <!-- 全域提醒橫幅 -->
    <template x-if="alerts.length">
      <div class="space-y-2">
        <template x-for="a in alerts" :key="a.key">
          <div class="rounded-2xl px-4 py-3 text-sm font-bold flex items-start gap-2 shadow-sm"
               :class="a.days<0 ? 'bg-red-100 text-red-700 border-2 border-red-200' : 'bg-yellow-100 text-yellow-800 border-2 border-yellow-200'">
            <span x-text="a.text"></span>
          </div>
        </template>
      </div>
    </template>

    <!-- 沒有寵物 -->
    <template x-if="!pet">
      <div class="card p-8 text-center space-y-4 mt-6">
        <div class="text-6xl">🐾</div>
        <p class="font-bold" x-text="t('no_pet')"></p>
        <div class="flex gap-2 justify-center flex-wrap">
          <button class="btn btn-main" @click="openPet()" x-text="t('add_pet')"></button>
          <button class="btn btn-soft" @click="loadDemo()" x-text="t('load_demo')"></button>
        </div>
      </div>
    </template>

    <template x-if="pet">
    <div class="space-y-4">

      <!-- ========== 1. 主頁 ========== -->
      <section x-show="tab==='home'" class="space-y-4">

        <!-- 今日待辦 -->
        <template x-if="todayGroups.length">
          <div class="card p-5 space-y-3">
            <h3 class="font-extrabold text-lg" x-text="'📋 ' + t('today_title')"></h3>
            <template x-for="g in todayGroups" :key="g.petId">
              <div class="space-y-2">
                <div class="text-sm font-bold text-orange-400" x-show="data.cats.length>1" x-text="speciesIcon(g.species) + ' ' + g.petName"></div>
                <template x-for="it in g.items" :key="it.key">
                  <div class="rounded-2xl border-2 p-3 flex items-center gap-3" :class="rowCls(it.status)">
                    <div class="text-center w-14 shrink-0">
                      <div class="font-extrabold" x-text="it.time"></div>
                      <div class="text-xs" x-text="it.kind==='med' ? '💊' : '💧'"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="font-bold break-words" x-text="it.title"></div>
                      <div class="text-xs text-stone-500 break-words" x-show="it.sub" x-text="it.sub"></div>
                      <div class="text-xs font-bold break-words" :class="statusCls(it.status)" x-text="statusText(it)"></div>
                    </div>
                    <div class="flex flex-col gap-1 shrink-0">
                      <button type="button" class="btn btn-green !px-3 !py-1 text-sm" x-show="isPending(it)" @click="doItem(it)" x-text="it.kind==='med' ? t('btn_given') : t('btn_injected')"></button>
                      <button type="button" class="btn btn-soft !px-3 !py-1 text-sm" x-show="isPending(it)" @click="skipItem(it)" x-text="t('btn_skip')"></button>
                      <button type="button" class="btn btn-soft !px-3 !py-1 text-sm" x-show="isFinished(it)" @click="undoItem(it)" x-text="t('btn_undo')"></button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <div class="card p-5 text-center">
          <div class="w-28 h-28 rounded-full mx-auto bg-orange-100 border-4 border-orange-200 overflow-hidden flex items-center justify-center text-5xl">
            <template x-if="pet.photo"><img :src="pet.photo" class="w-full h-full object-cover"></template>
            <template x-if="!pet.photo"><span x-text="speciesIcon(pet.species)"></span></template>
          </div>
          <h2 class="mt-3 text-2xl font-extrabold" x-text="pet.name"></h2>
          <p class="text-sm text-orange-400 font-bold" x-text="age(pet.birth)"></p>
          <div class="grid grid-cols-2 gap-2 mt-4 text-left text-sm">
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('birth')"></span><b x-text="pet.birth || '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('gender')"></span><b x-text="pet.gender ? lbl('g_', pet.gender) : '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('species')"></span><b x-text="lbl('sp_', pet.species || 'cat')"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('breed')"></span><b x-text="pet.breed || '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3 col-span-2"><span class="lbl" x-text="t('chip')"></span><b class="break-all" x-text="pet.chip || '—'"></b></div>
          </div>
          <div class="flex gap-2 justify-center mt-4 flex-wrap">
            <button class="btn btn-soft" @click="openPet(pet)" x-text="'✏️ ' + t('edit')"></button>
            <button class="btn btn-main" @click="openPet()" x-text="t('add_pet')"></button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="card p-4 text-center">
            <div class="text-2xl">⚖️</div><span class="lbl" x-text="t('latest_weight')"></span>
            <b class="text-lg" x-text="latestWeight ? fmtW(latestWeight.kg) : t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="latestWeight ? latestWeight.date : ''"></div>
          </div>
          <div class="card p-4 text-center">
            <div class="text-2xl">💊</div><span class="lbl" x-text="t('next_med')"></span>
            <b class="text-lg" x-text="nextMedSummary.date || t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="nextMedSummary.name"></div>
          </div>
          <div class="card p-4 text-center">
            <div class="text-2xl">💉</div><span class="lbl" x-text="t('next_vax')"></span>
            <b class="text-lg" x-text="nextVaccineSummary.date || t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="nextVaccineSummary.name"></div>
          </div>
        </div>
      </section>

      <!-- ========== 2. 體重 ========== -->
      <section x-show="tab==='weight'" class="space-y-4">
        <form class="card p-5 space-y-3" @submit.prevent="saveWeight()">
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-extrabold text-lg" x-text="wForm.id ? '✏️ ' + t('w_edit') : '⚖️ ' + t('w_add')"></h3>
            <select class="inp !w-auto !py-1 !text-sm font-bold" x-model="unit" :aria-label="t('unit')">
              <option value="kg">kg</option><option value="lb">lb</option><option value="g">g</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl" x-text="t('date')"></label><input type="date" class="inp" required x-model="wForm.date"></div>
            <div><label class="lbl" x-text="t('weight') + ' (' + unit + ')'"></label><input type="number" :step="unit==='g' ? '1' : '0.01'" min="0" class="inp" required x-model="wForm.kg" :placeholder="unit==='g' ? '4200' : (unit==='lb' ? '9.25' : '4.20')"></div>
          </div>
          <div><label class="lbl" x-text="t('note')"></label><input class="inp" x-model="wForm.note" :placeholder="t('ph_wnote')"></div>
          <div class="flex gap-2">
            <button class="btn btn-main flex-1" type="submit" x-text="wForm.id ? t('save_changes') : t('add')"></button>
            <button type="button" class="btn btn-soft" x-show="wForm.id" @click="resetWeight()" x-text="t('cancel')"></button>
          </div>
        </form>

        <div class="card p-4">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-extrabold" x-text="'📈 ' + t('trend')"></h3>
            <span class="text-xs text-stone-400" x-show="pet.targetKg" x-text="t('target_lbl') + ': ' + fmtW(pet.targetKg)"></span>
          </div>
          <div class="relative h-60"><canvas id="weightChart"></canvas></div>
          <p class="text-center text-stone-400 text-sm mt-2" x-show="pet.weights.length<1" x-text="t('trend_empty')"></p>
        </div>

        <div class="card p-4">
          <h3 class="font-extrabold mb-2" x-text="'📋 ' + t('history')"></h3>
          <template x-for="w in [...pet.weights].sort((a,b)=>b.date.localeCompare(a.date))" :key="w.id">
            <div class="flex items-center justify-between py-2 border-b border-orange-50 last:border-0">
              <div>
                <b x-text="fmtW(w.kg)"></b>
                <span class="text-xs text-stone-400 ml-2" x-text="w.date"></span>
                <div class="text-xs text-stone-500" x-text="w.note"></div>
              </div>
              <div class="flex gap-1">
                <button class="btn btn-soft !px-3 !py-1 text-sm" @click="editWeight(w)" x-text="t('edit')"></button>
                <button class="btn btn-soft !px-3 !py-1 text-sm" @click="delWeight(w.id)" x-text="t('delete')"></button>
              </div>
            </div>
          </template>
          <p class="text-center text-stone-400 py-3" x-show="!pet.weights.length" x-text="t('no_weights')"></p>
        </div>
      </section>

      <!-- ========== 3. 醫療（子分頁） ========== -->
      <section x-show="tab==='medical'" class="space-y-4">

        <div class="flex gap-2 overflow-x-auto pb-1">
          <template x-for="s in msubs" :key="s.id">
            <button type="button" class="btn whitespace-nowrap text-sm" :class="msub===s.id ? 'btn-main' : 'btn-soft'" @click="msub=s.id" x-text="s.icon + ' ' + t('sub_' + s.id)"></button>
          </template>
        </div>

        <!-- ---- 3a. 每日藥物 ---- -->
        <div x-show="msub==='daily'" class="space-y-4">

          <div class="card p-5 space-y-3">
            <h3 class="font-extrabold text-lg" x-text="'⏰ ' + t('dm_slots')"></h3>
            <div class="flex items-center gap-2">
              <button type="button" class="btn btn-soft !px-3" @click="dmShift(-1)">‹</button>
              <input type="date" class="inp" x-model="dmDate">
              <button type="button" class="btn btn-soft !px-3" @click="dmShift(1)">›</button>
              <button type="button" class="btn btn-soft whitespace-nowrap" @click="dmDate = today()" x-text="t('dm_today')"></button>
            </div>
            <template x-for="it in dmItems" :key="it.key">
              <div class="rounded-2xl border-2 p-3 flex items-center gap-3" :class="rowCls(it.status)">
                <div class="text-center w-14 shrink-0">
                  <div class="font-extrabold" x-text="it.time"></div>
                  <div class="text-xs">💊</div>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="font-bold break-words" x-text="it.title"></div>
                  <div class="text-xs text-stone-500 break-words" x-show="it.sub" x-text="it.sub"></div>
                  <div class="text-xs font-bold break-words" :class="statusCls(it.status)" x-text="statusText(it)"></div>
                </div>
                <div class="flex flex-col gap-1 shrink-0">
                  <button type="button" class="btn btn-green !px-3 !py-1 text-sm" x-show="isPending(it)" @click="doItem(it)" x-text="it.kind==='med' ? t('btn_given') : t('btn_injected')"></button>
                  <button type="button" class="btn btn-soft !px-3 !py-1 text-sm" x-show="isPending(it)" @click="skipItem(it)" x-text="t('btn_skip')"></button>
                  <button type="button" class="btn btn-soft !px-3 !py-1 text-sm" x-show="isFinished(it)" @click="undoItem(it)" x-text="t('btn_undo')"></button>
                </div>
              </div>
            </template>
            <p class="text-center text-stone-400 py-2" x-show="!dmItems.length" x-text="t('dm_no_slots')"></p>
            <button type="button" class="btn btn-soft w-full" @click="exportCalendar()" x-text="t('cal_export')"></button>
          </div>

          <form class="card p-5 space-y-3" @submit.prevent="saveDm()">
            <h3 class="font-extrabold text-lg" x-text="dmForm.id ? '✏️ ' + t('dm_edit') : '💊 ' + t('dm_add')"></h3>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="lbl" x-text="t('dm_name')"></label><input class="inp" required x-model="dmForm.name" :placeholder="t('ph_dmname')"></div>
              <div><label class="lbl" x-text="t('dm_dose')"></label><input class="inp" x-model="dmForm.dose" :placeholder="t('ph_dmdose')"></div>
            </div>
            <div>
              <label class="lbl" x-text="t('dm_times')"></label>
              <div class="space-y-2">
                <template x-for="(tm, i) in dmForm.times" :key="i">
                  <div class="flex items-center gap-2">
                    <input type="time" class="inp" required x-model="dmForm.times[i]">
                    <button type="button" class="btn btn-soft !px-3" x-show="dmForm.times.length>1" @click="dmForm.times.splice(i,1)">✕</button>
                  </div>
                </template>
              </div>
              <button type="button" class="btn btn-soft mt-2 text-sm" @click="dmForm.times.push('12:00')" x-text="t('dm_add_time')"></button>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="lbl" x-text="t('dm_start')"></label><input type="date" class="inp" required x-model="dmForm.start"></div>
              <div><label class="lbl" x-text="t('dm_end')"></label><input type="date" class="inp" x-model="dmForm.end"></div>
            </div>
            <div><label class="lbl" x-text="t('note')"></label><textarea rows="2" class="inp" x-model="dmForm.note"></textarea></div>
            <div class="flex gap-2">
              <button class="btn btn-main flex-1" type="submit" x-text="dmForm.id ? t('save_changes') : t('add')"></button>
              <button type="button" class="btn btn-soft" x-show="dmForm.id" @click="resetDm()" x-text="t('cancel')"></button>
            </div>
          </form>

          <p class="text-center text-stone-400 py-4" x-show="!pet.daily.length" x-text="t('no_daily')"></p>
          <p class="text-xs text-stone-400 px-1" x-show="pet.daily.length" x-text="t('dm_legend')"></p>
          <template x-for="m in dmList" :key="m.id">
            <div class="card p-4 space-y-3" :class="isEnded(m) ? 'opacity-80' : ''">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <h4 class="font-extrabold text-lg break-words" x-text="m.name"></h4>
                  <div class="text-sm text-stone-500 break-words" x-show="m.dose" x-text="m.dose"></div>
                </div>
                <span class="text-xs font-bold rounded-full px-3 py-1 whitespace-nowrap"
                      :class="isEnded(m) ? 'bg-orange-50 text-stone-500' : 'bg-green-100 text-green-700'"
                      x-text="isEnded(m) ? t('dm_ended') : (m.end ? t('dm_until', {d: m.end}) : t('dm_longterm'))"></span>
              </div>
              <div class="flex flex-wrap gap-2 items-center">
                <span class="text-xs text-stone-500" x-text="t('dm_n_times', {n: m.times.length})"></span>
                <template x-for="tm in sortedTimes(m)" :key="tm">
                  <span class="text-xs font-bold bg-orange-100 text-orange-600 rounded-full px-2 py-0.5" x-text="tm"></span>
                </template>
              </div>
              <div class="text-sm" x-text="rate7Text(m)"></div>
              <div>
                <span class="lbl" x-text="t('dm_hist')"></span>
                <div class="flex gap-1 overflow-x-auto pb-1">
                  <template x-for="d in histDays" :key="d">
                    <div class="flex flex-col items-center gap-1 min-w-[26px]">
                      <template x-for="tm in sortedTimes(m)" :key="tm">
                        <div class="w-4 h-4 rounded" :class="cellCls(slotState(pet, m, d, tm))" :title="d + ' ' + tm"></div>
                      </template>
                      <div class="text-[10px] text-stone-400" x-text="d.slice(8)"></div>
                    </div>
                  </template>
                </div>
              </div>
              <p class="text-sm text-stone-500 whitespace-pre-wrap" x-show="m.note" x-text="m.note"></p>
              <div class="flex gap-2 flex-wrap">
                <button type="button" class="btn btn-soft" @click="editDm(m)" x-text="t('edit')"></button>
                <button type="button" class="btn btn-soft" @click="delDm(m.id)" x-text="t('delete')"></button>
              </div>
            </div>
          </template>
        </div>

        <!-- ---- 3b. 皮下水 ---- -->
        <div x-show="msub==='fluids'" class="space-y-4">
          <div class="card p-5 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <h3 class="font-extrabold text-lg" x-text="'💧 ' + t('fl_plan')"></h3>
              <button type="button" class="btn btn-soft !py-1 text-sm" x-show="!planEdit" @click="openPlan()" x-text="pet.fluidPlan ? t('fl_edit_plan') : t('fl_set_plan')"></button>
            </div>
            <template x-if="!planEdit && pet.fluidPlan">
              <div class="text-sm space-y-1">
                <p class="font-bold" x-text="planSummary(pet.fluidPlan)"></p>
                <p class="text-stone-500" x-show="pet.fluidPlan.fluid" x-text="pet.fluidPlan.fluid"></p>
                <p class="text-xs text-stone-400" x-text="perKgText(pet, pet.fluidPlan.perDose)"></p>
              </div>
            </template>
            <p class="text-sm text-stone-400" x-show="!planEdit && !pet.fluidPlan" x-text="t('fl_plan_none')"></p>

            <template x-if="planEdit">
              <form class="space-y-3" @submit.prevent="savePlan()">
                <label class="flex items-center gap-2 text-sm font-bold">
                  <input type="checkbox" class="w-5 h-5" x-model="planForm.on">
                  <span x-text="t('fl_on')"></span>
                </label>
                <div><label class="lbl" x-text="t('fl_fluid')"></label>
                  <input class="inp" list="fluidList" x-model="planForm.fluid" :placeholder="t('ph_fluid')">
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div><label class="lbl" x-text="t('fl_per')"></label><input type="number" step="0.1" min="0" inputmode="decimal" class="inp" required x-model="planForm.perDose"></div>
                  <div>
                    <label class="lbl" x-text="t('fl_mode')"></label>
                    <select class="inp" x-model="planForm.mode">
                      <option value="daily" x-text="t('fl_mode_daily')"></option>
                      <option value="interval" x-text="t('fl_mode_int')"></option>
                    </select>
                  </div>
                </div>
                <div x-show="planForm.mode==='daily'">
                  <label class="lbl" x-text="t('fl_times')"></label>
                  <div class="space-y-2">
                    <template x-for="(tm, i) in planForm.times" :key="i">
                      <div class="flex items-center gap-2">
                        <input type="time" class="inp" x-model="planForm.times[i]">

        <!-- ---- 3f. 疫苗 ---- -->

                <div class="text-sm" x-show="v.next">

        <!-- ---- 3g. 生理數據 (血糖/血壓/心跳) ---- -->

              <div><label class="lbl" x-text="t('date')"></label><input type="date" class="inp" required x-model="vtForm.date"></div>
              <div><label class="lbl" x-text="t('fl_time')"></label><input type="time" class="inp" x-model="vtForm.time"></div>

            <div class="grid grid-cols-3 gap-2">

              <button class="btn btn-soft !px-3 !py-1 text-sm" @click="delVital(vt.id)" x-text="t('delete')"></button>
            </div>
          </template>
        </div>

                <p class="text-sm mt-1 whitespace-pre-wrap" x-text="e.note"></p>

          </template>
          <p class="text-center text-stone-400 py-2" x-show="!pet.events.length" x-text="t('no_events')"></p>

      <!-- ========== 4. 生活 ========== -->

              <label class="lbl" x-text="t('category')"></label>
              <select class="inp" x-model="lForm.type">

              </template>
            </div>
          </div>

        <p class="text-center text-stone-400 py-2" x-show="!pet.lifeLogs.length" x-text="t('no_life')"></p>

          <h3 class="font-extrabold text-lg" x-text="'📦 ' + t('full_title')"></h3>

            <button type="button" class="btn btn-soft" @click="restoreBackup()" x-text="t('restore_backup')"></button>

/* ---------- IndexedDB ---------- */
const DB_NAME = 'petTrackerFiles', STORE = 'files';
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function idbPut(rec) { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(rec); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function idbGet(id) { const db = await openDB(); return new Promise((res, rej) => { const q = db.transaction(STORE).objectStore(STORE).get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbDel(id) { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).delete(id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function idbAll() { const db = await openDB(); return new Promise((res, rej) => { const q = db.transaction(STORE).objectStore(STORE).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbClear() { const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

/* ---------- 檔案工具 ---------- */
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }
function compressImage(file, max = 1200, q = 0.8) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(r.error);
    r.onload = e => {
      const img = new Image();
      img.onerror = () => rej(new Error('img'));
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * s), h = Math.round(img.height * s);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}
function dataUrlToBlob(u) {
  const parts = u.split(','), mime = (parts[0].match(/:(.*?);/) || [])[1] || 'application/octet-stream';
  const bin = atob(parts[1]), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

const emptyFiles = () => ({ files: [], added: [], removed: [] });

    t(k, v) {

    async addFiles(form, ev, allowPdf) {
      const list = [...ev.target.files]; ev.target.value = '';

        try {
          let rec;
          if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
            if (!allowPdf) { this.say(this.t('t_imgonly')); continue; }
            if (f.size > MAX_PDF) { this.say(this.t('t_toobig')); continue; }
            rec = { id: uid(), name: f.name, type: 'application/pdf', data: await readAsDataURL(f) };
          } else if (f.type.startsWith('image/')) {
            rec = { id: uid(), name: f.name, type: 'image/jpeg', data: await compressImage(f) };

    },
    removeFile(form, f) {

    async removeFiles(list) {

    plainFiles(arr) { return (arr || []).map(x => ({ id: x.id, name: x.name, type: x.type })); },

    async exportFull() {

    today() { return this.iso(new Date(this.clock)); },
    nowHM() { const d = new Date(this.clock); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); },
    mins(hm) { const [h, m] = String(hm || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); },
    iso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); },
    parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
    addDays(s, n) { const d = this.parse(s); d.setDate(d.getDate() + Number(n)); return this.iso(d); },

    age(b) {

    latestWeightOf(p) { if (!p || !p.weights.length) return null; return [...p.weights].sort((a, b) => b.date.localeCompare(a.date))[0]; },
    get latestWeight() { return this.latestWeightOf(this.pet); },
    get totalExpenses() {

      (this.pet.reports || []).forEach(rp => sum += Number(rp.cost) || 0);
      (this.pet.vaccines || []).forEach(v => sum += Number(v.cost) || 0);

    get medTypesFor() {

    get vaccSuggest() { const sp = this.pet ? this.pet.species : 'cat'; return (VACC[sp] || VACC.other)[this.lang]; },
    get sortedMeds() { return [...this.pet.meds].sort((a, b) => this.nextDate(a).localeCompare(this.nextDate(b))); },
    get nextMedSummary() {

    get nextVaccineSummary() {

    get rxActive() {

    get reportsSorted() { return this.pet ? [...this.pet.reports].sort((a, b) => b.date.localeCompare(a.date)) : []; },

    medSlots(p, date) {

    fluidSlots(p, date) {

      const sub = pl.perDose + ' ml' + (pl.fluid ? ' · ' + pl.fluid : '');
      const title = '💧 ' + this.t('fl_title');
      const base = { kind: 'fluid', petId: p.id, petName: p.name, date, title, sub };
      if (pl.mode === 'interval') {

    get todayGroups() {

    slotState(p, m, date, time) {

    doseStats(p, m, days) {

    savePlan() {

    delPlan() { this.ask(this.t('c_delplan'), () => { if (this.pet) this.pet.fluidPlan = null; this.planEdit = false; }); },
    get fluidStats() {
      const out = { todayTotal: 0, week: 0, avg: 0, last: null };
      if (!this.pet) return out;
      const today = this.today(), from = this.addDays(today, -6);
      let td = 0, wk = 0;
      for (const r of this.pet.fluids) {
        if (r.skipped) continue;
        const v = Number(r.ml) || 0;
        if (r.date === today) td += v;
        if (r.date >= from && r.date <= today) wk += v;
      }
      out.todayTotal = Math.round(td * 10) / 10; out.week = Math.round(wk * 10) / 10; out.avg = Math.round(wk / 7 * 10) / 10;

    get fluidNext() {

    get fluidAllDays() {
      if (!this.pet) return [];

      for (const r of this.pet.fluids) (map[r.date] = map[r.date] || []).push(r);
      return Object.keys(map).sort().reverse().map(d => {
        const items = map[d].slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));

    },
    get fluidDays() { const a = this.fluidAllDays; return this.fluidShowAll ? a : a.slice(0, 30); },
    autoSlot(p, date, time) {
      const pl = p.fluidPlan;
      if (!pl || pl.on === false) return '';
      if (pl.mode === 'interval') return (p.fluids || []).some(r => r.date === date && r.slot === 'I') ? '' : 'I';
      const taken = new Set((p.fluids || []).filter(r => r.date === date && r.slot).map(r => r.slot));
      const free = (pl.times || []).filter(x => !taken.has(x));
      if (!free.length) return '';
      const tm = this.mins(time);
      free.sort((a, b) => Math.abs(this.mins(a) - tm) - Math.abs(this.mins(b) - tm));

    openFluid(o) {

    icsFold(line) {
      const enc = new TextEncoder(); let out = '', cur = '', bytes = 0;
      for (const ch of line) {
        const b = enc.encode(ch).length;
        if (bytes + b > 73) { out += cur + '\r\n '; cur = ''; bytes = 1; }
        cur += ch; bytes += b;
      }
      return out + cur;
    },
    exportCalendar() {
      const p = this.pet; if (!p) return;
      const today = this.today();
      const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
      const d8 = s => s.replace(/-/g, ''), t6 = tm => tm.replace(':', '') + '00';
      const esc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
      const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Pet Health Tracker//EN', 'CALSCALE:GREGORIAN'];
      let n = 0;
      const addEv = (key, summary, desc, startDate, tm, rrule) => {
        lines.push('BEGIN:VEVENT', 'UID:' + key + '@pet-health-tracker', 'DTSTAMP:' + stamp, 'DTSTART:' + d8(startDate) + 'T' + t6(tm), 'DURATION:PT15M', 'RRULE:' + rrule,
          'SUMMARY:' + esc(summary), 'DESCRIPTION:' + esc(desc), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(summary), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
        n++;
      };
      for (const m of p.daily) {
        if (m.end && m.end < today) continue;
        const start = m.start > today ? m.start : today;
        const rr = 'FREQ=DAILY' + (m.end ? ';UNTIL=' + d8(m.end) + 'T235959' : '');
        for (const tm of m.times) addEv(m.id + '-' + tm.replace(':', ''), this.t('cal_dose', { pet: p.name, name: m.name, dose: m.dose ? ' ' + m.dose : '' }), m.note || '', start, tm, rr);
      }
      const pl = p.fluidPlan;
      if (pl && pl.on !== false && Number(pl.perDose) > 0) {
        const summary = this.t('cal_fluid', { pet: p.name, ml: pl.perDose });
        if (pl.mode === 'interval') {
          let first = this.fluidDue(p) || today; if (first < today) first = today;
          const tm = (pl.times && pl.times[0]) || '09:00';
          addEv('fl-' + p.id + '-i', summary, pl.fluid || '', first, tm, 'FREQ=DAILY;INTERVAL=' + (pl.intervalDays || 1));
        } else {
          const start = (pl.start && pl.start > today) ? pl.start : today;
          for (const tm of (pl.times || [])) addEv('fl-' + p.id + '-' + tm.replace(':', ''), summary, pl.fluid || '', start, tm, 'FREQ=DAILY');
        }
      }
      if (!n) return this.say(this.t('cal_none'));
      lines.push('END:VCALENDAR');
      const text = lines.map(l => this.icsFold(l)).join('\r\n') + '\r\n';
      this.ask(this.t('cal_warn'), async () => {
        try {
          const file = new File([text], 'pet-reminders.ics', { type: 'text/calendar' });
          if (await this.shareOrDownload(file)) this.say(this.t('cal_done'));
        } catch (e) { this.say(this.t('cal_fail')); }
      });
    },

    get alerts() {
      const out = [];
      for (const c of this.data.cats) {
        for (const m of c.meds) {
          const d = this.diffDays(this.nextDate(m));
          const p = { pet: c.name, name: m.name, n: Math.abs(d) };
          if (d < 0) out.push({ key: 'm' + m.id, days: d, text: this.t('al_med_over', p) });
          else if (d <= 7) out.push({ key: 'm' + m.id, days: d, text: this.t(d === 0 ? 'al_med_today' : 'al_med_soon', p) });
        }
        for (const v of c.vaccines) {
          if (!v.next) continue;
          const d = this.diffDays(v.next);
          const p = { pet: c.name, name: v.name, n: Math.abs(d) };
          if (d < 0) out.push({ key: 'v' + v.id, days: d, text: this.t('al_vax_over', p) });
          else if (d <= 7) out.push({ key: 'v' + v.id, days: d, text: this.t(d === 0 ? 'al_vax_today' : 'al_vax_soon', p) });
        }
        for (const r of (c.rx || [])) {
          if (!r.remind || !r.days) continue;
          const d = this.diffDays(this.rxLast(r));
          const lim = (r.remindDays === undefined || r.remindDays === null || r.remindDays === '') ? 3 : Number(r.remindDays);
          const p = { pet: c.name, name: r.name, n: Math.abs(d) };
          if (d < 0) out.push({ key: 'r' + r.id, days: d, text: this.t('al_rx_over', p) });
          else if (d <= lim) out.push({ key: 'r' + r.id, days: d, text: this.t(d === 0 ? 'al_rx_today' : 'al_rx_soon', p) });
        }
      }
      for (const g of this.todayGroups) for (const it of g.items) {
        if (it.status !== 'due' && it.status !== 'late') continue;
        const p = { pet: g.petName, name: it.title, time: it.time, n: it.overdueDays || 0 };
        let text;
        if (it.kind === 'med') text = this.t(it.status === 'late' ? 'al_dose_late' : 'al_dose_due', p);
        else text = it.overdueDays > 0 ? this.t('al_fl_overdue', p) : this.t(it.status === 'late' ? 'al_fl_late' : 'al_fl_due', p);
        out.push({ key: 'd' + it.key, days: it.status === 'late' ? -1 : 0, text });
      }
      return out.sort((a, b) => a.days - b.days);
    },

    pickPhoto(ev) {

        meds: [
          { id: uid(), name: this.t('demo_med1'), type: 'flea', cycle: 30, last: this.addDays(t, -33), cost: 150 },
          { id: uid(), name: 'Bravecto', type: 'flea', cycle: 90, last: this.addDays(t, -85), cost: 300 },
          { id: uid(), name: this.t('demo_hw'), type: 'heartworm', cycle: 30, last: this.addDays(t, -10), cost: 120 },
        ],
        weights: [-120, -90, -60, -30, 0].map((o, i) => ({ id: uid(), date: this.addDays(t, o), kg: [3.9, 4.0, 4.1, 4.15, 4.2][i], note: '' })),
        vaccines: [{ id: uid(), name: this.t('demo_vax'), date: this.addDays(t, -360), next: this.addDays(t, 5), cost: 400 }],
        events: [{ id: uid(), date: this.addDays(t, -2), type: 'diarrhea', note: this.t('demo_ev') }],
        lifeLogs: [], vets: [], rx: [], reports: [], vitals: [{ id: uid(), date: this.today(), time: '09:00', bg: 110, bp: '120/80', hr: 115, note: '空腹' }], daily: [], dlog: {}, fluids: [], fluidPlan: null,
        clinic: { name: this.t('demo_clinic'), vet: this.t('demo_vet'), phone: '0212345678', address: '' },
      });
      this.data.activeId = id;
    },

    nextDate(m) { return this.addDays(m.last, m.cycle); },
    statusOf(m) {
      const d = this.diffDays(this.nextDate(m));
      if (d < 0) return { key: 'red', label: this.t('st_over'), cls: 'bg-red-100 text-red-600', detail: this.t('d_over', { n: -d }) };
      if (d <= 7) return { key: 'yellow', label: this.t('st_soon'), cls: 'bg-yellow-100 text-yellow-700', detail: d === 0 ? this.t('d_today') : this.t('d_left', { n: d }) };
      return { key: 'green', label: this.t('st_ok'), cls: 'bg-green-100 text-green-700', detail: this.t('d_ok', { n: d }) };
    },
    vStatus(v) {
      const d = this.diffDays(v.next);
      if (d < 0) return { label: this.t('st_over'), cls: 'bg-red-100 text-red-600' };
      if (d <= 7) return { label: this.t('st_soon'), cls: 'bg-yellow-100 text-yellow-700' };
      return { label: this.t('st_ok'), cls: 'bg-green-100 text-green-700' };
    },
    resetMed() { this.mForm = { id: null, name: '', type: this.medTypesFor[0], cycle: '30', custom: '', last: this.today(), cost: '' }; },
    saveMed() {
      const cycle = this.mForm.cycle === 'custom' ? Number(this.mForm.custom) : Number(this.mForm.cycle);
      if (!cycle || cycle < 1) return this.say(this.t('t_cycle'));
      const item = { id: this.mForm.id || uid(), name: this.mForm.name.trim(), type: this.mForm.type, cycle, last: this.mForm.last, cost: Number(this.mForm.cost) || 0 };
      const i = this.pet.meds.findIndex(m => m.id === item.id);
      if (i >= 0) this.pet.meds[i] = item; else this.pet.meds.push(item);
      this.resetMed();
    },
    editMed(m) {
      const preset = ['30', '60', '90', '180', '365'].includes(String(m.cycle));
      this.mForm = { id: m.id, name: m.name, type: m.type, cycle: preset ? String(m.cycle) : 'custom', custom: preset ? '' : m.cycle, last: m.last, cost: m.cost || '' };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    markFed(m) { m.last = this.today(); },
    delMed(id) { this.ask(this.t('c_delmed'), () => { this.pet.meds = this.pet.meds.filter(m => m.id !== id); }); },

    hasDays(v) { return v !== '' && v !== null && v !== undefined && Number(v) > 0; },
    rxLast(r) { return r.days ? this.addDays(r.start, Number(r.days) - 1) : null; },
    rxStatus(r) {
      const last = this.rxLast(r);
      if (!last) return { label: this.t('rx_longterm'), cls: 'bg-orange-100 text-orange-600', detail: '', ended: false };
      const d = this.diffDays(last);
      if (d < 0) return { label: this.t('rx_ended_l'), cls: 'bg-orange-50 text-stone-500', detail: this.t('rx_endedn', { n: -d }), ended: true };
      if (d === 0) return { label: this.t('rx_lastday_l'), cls: 'bg-yellow-100 text-yellow-700', detail: this.t('rx_lastday'), ended: false };
      return { label: this.t('rx_going'), cls: 'bg-green-100 text-green-700', detail: this.t('rx_left', { n: d + 1 }), ended: false };
    },
    resetRx() { this.rxForm = { id: null, name: '', kind: 'rx', dose: '', freq: '', start: this.today(), days: '', reason: '', doctor: '', note: '', remind: false, remindDays: 3, cost: '', ...emptyFiles() }; },
    async saveRx() {
      const f = this.rxForm;
      const days = this.hasDays(f.days) ? Number(f.days) : null;
      if (f.days !== '' && f.days !== null && f.days !== undefined && days === null) return this.say(this.t('t_days'));
      const rd = (f.remindDays === '' || f.remindDays === null || f.remindDays === undefined) ? 3 : Number(f.remindDays);
      const item = {
        id: f.id || uid(), name: f.name.trim(), kind: f.kind, dose: f.dose, freq: f.freq, start: f.start, days,
        reason: f.reason, doctor: f.doctor, note: f.note, cost: Number(f.cost) || 0,
        remind: !!f.remind && days !== null, remindDays: (isNaN(rd) || rd < 0) ? 3 : rd, files: this.plainFiles(f.files),
      };
      await this.commitForm(f);
      const i = this.pet.rx.findIndex(x => x.id === item.id);
      if (i >= 0) this.pet.rx[i] = item; else this.pet.rx.push(item);
      this.resetRx();
    },
    async editRx(r) {
      await this.discardForm(this.rxForm);
      this.rxForm = {
        id: r.id, name: r.name, kind: r.kind || 'rx', dose: r.dose || '', freq: r.freq || '', start: r.start,
        days: r.days ? r.days : '', reason: r.reason || '', doctor: r.doctor || '', note: r.note || '', cost: r.cost || '',
        remind: !!r.remind, remindDays: (r.remindDays === undefined || r.remindDays === null) ? 3 : r.remindDays,
        files: this.plainFiles(r.files), added: [], removed: [],
      };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    async cancelRx() { await this.discardForm(this.rxForm); this.resetRx(); },
    delRx(id) {
      this.ask(this.t('c_delrx'), () => {
        const r = this.pet.rx.find(x => x.id === id); if (r) this.removeFiles(r.files);
        this.pet.rx = this.pet.rx.filter(x => x.id !== id);
      });
    },

    resetReport() { this.rpForm = { id: null, type: 'blood', date: this.today(), clinic: '', summary: '', opinion: '', cost: '', ...emptyFiles() }; },
    async saveReport() {
      const f = this.rpForm;
      const item = { id: f.id || uid(), type: f.type, date: f.date, clinic: f.clinic, summary: f.summary, opinion: f.opinion, cost: Number(f.cost) || 0, files: this.plainFiles(f.files) };
      await this.commitForm(f);
      const i = this.pet.reports.findIndex(x => x.id === item.id);
      if (i >= 0) this.pet.reports[i] = item; else this.pet.reports.push(item);
      this.resetReport();
    },
    async editReport(r) {
      await this.discardForm(this.rpForm);
      this.rpForm = { id: r.id, type: r.type, date: r.date, clinic: r.clinic || '', summary: r.summary || '', opinion: r.opinion || '', cost: r.cost || '', files: this.plainFiles(r.files), added: [], removed: [] };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    async cancelReport() { await this.discardForm(this.rpForm); this.resetReport(); },
    delReport(id) {
      this.ask(this.t('c_delrp'), () => {
        const r = this.pet.reports.find(x => x.id === id); if (r) this.removeFiles(r.files);
        this.pet.reports = this.pet.reports.filter(x => x.id !== id);
      });
    },

    resetWeight() { this.wForm = { id: null, date: this.today(), kg: '', note: '' }; },
    saveWeight() {
      const val = Number(this.wForm.kg);
      if (!val || val <= 0) return this.say(this.t('t_wpos'));
      const item = { id: this.wForm.id || uid(), date: this.wForm.date, kg: this.toKg(val), note: this.wForm.note };
      const i = this.pet.weights.findIndex(w => w.id === item.id);
      if (i >= 0) this.pet.weights[i] = item; else this.pet.weights.push(item);
      this.resetWeight();
    },
    editWeight(w) { this.wForm = { id: w.id, date: w.date, kg: this.fromKg(w.kg), note: w.note }; window.scrollTo({ top: 0, behavior: 'smooth' }); },
    delWeight(id) { this.ask(this.t('c_delw'), () => { this.pet.weights = this.pet.weights.filter(w => w.id !== id); }); },
    drawChart() {
      if (this.tab !== 'weight' || !this.pet) return;
      if (typeof Chart === 'undefined') return;
      const cv = document.getElementById('weightChart'); if (!cv) return;
      const ws = [...this.pet.weights].sort((a, b) => a.date.localeCompare(b.date));
      const old = Chart.getChart(cv); if (old) old.destroy();
      weightChart = null;
      const unit = this.unit;
      const datasets = [{
        label: this.t('weight') + ' (' + unit + ')',
        data: ws.map(w => this.fromKg(w.kg)),
        borderColor: '#f9a98f', backgroundColor: 'rgba(249,169,143,.2)', fill: true, tension: .35,
        pointBackgroundColor: '#fff', pointBorderColor: '#f26f4e', pointBorderWidth: 2, pointRadius: 5
      }];
      if (this.pet.targetKg) {
        datasets.push({
          label: this.t('target_lbl'),
          data: ws.map(() => this.fromKg(this.pet.targetKg)),
          borderColor: '#bfe8c9', borderDash: [5, 5], pointRadius: 0, fill: false, borderWidth: 2
        });
      }
      weightChart = new Chart(cv, {
        type: 'line',
        data: { labels: ws.map(w => w.date.slice(5)), datasets },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: !!this.pet.targetKg }, tooltip: { callbacks: { title: i => ws[i[0].dataIndex].date } } }, scales: { y: { title: { display: true, text: unit } } } }
      });
    },

    resetVaccine() { this.vForm = { name: '', date: this.today(), next: '', cost: '' }; },
    saveVaccine() { this.pet.vaccines.push({ id: uid(), ...this.vForm, cost: Number(this.vForm.cost) || 0 }); this.resetVaccine(); },
    delVaccine(id) { this.ask(this.t('c_delvax'), () => { this.pet.vaccines = this.pet.vaccines.filter(v => v.id !== id); }); },
    
    resetVital() { this.vtForm = { date: this.today(), time: this.nowHM(), bg: '', bp: '', hr: '', note: '' }; },
    saveVital() {
      this.pet.vitals.push({ id: uid(), ...this.vtForm });
      this.resetVital();
    },
    delVital(id) { this.ask(this.t('c_delvt'), () => { this.pet.vitals = this.pet.vitals.filter(v => v.id !== id); }); },

    resetEvent() { this.eForm = { date: this.today(), type: this.eventTypes[0], note: '' }; },
    saveEvent() { this.pet.events.push({ id: uid(), ...this.eForm }); this.resetEvent(); },
    delEvent(id) { this.ask(this.t('c_delev'), () => { this.pet.events = this.pet.events.filter(e => e.id !== id); }); },
    eventIcon(t) { return { vomit: '🤮', diarrhea: '💩', appetite: '🍽️', lethargy: '😔', cough: '🤧' }[t] || '📌'; },
    resetLife() { this.lForm = { date: this.today(), type: this.lifeTypes[0], note: '', ...emptyFiles() }; },
    async saveLife() {
      const f = this.lForm;
      const item = { id: uid(), date: f.date, type: f.type, note: f.note, files: this.plainFiles(f.files) };
      await this.commitForm(f);
      this.pet.lifeLogs.push(item);
      this.resetLife();
    },
    delLife(id) {
      this.ask(this.t('c_dellife'), () => {
        const l = this.pet.lifeLogs.find(x => x.id === id); if (l) this.removeFiles(l.files);
        this.pet.lifeLogs = this.pet.lifeLogs.filter(x => x.id !== id);
      });
    },
    resetVet() { this.vetForm = { name: '', doctor: '', phone: '', note: '' }; },
    saveVet() { this.pet.vets.push({ id: uid(), ...this.vetForm }); this.resetVet(); },
    delVet(id) { this.ask(this.t('c_delvet'), () => { this.pet.vets = this.pet.vets.filter(v => v.id !== id); }); },
  };
}
</script>
</body>
</html>
